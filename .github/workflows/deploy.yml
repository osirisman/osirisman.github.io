# GitHub Pages 자동 배포 설정입니다.
# main 브랜치에 올릴 때마다 사이트를 빌드해서 https://osirisman.github.io 에 올립니다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4
      - name: 설치, 빌드, 업로드
        uses: withastro/action@v5
      - name: GitHub Pages에 배포
        id: deployment
        uses: actions/deploy-pages@v4
