# GitHub Pages 자동 배포 설정입니다.
# main 브랜치에 올릴 때마다 두 사이트를 함께 만들어 https://osirisman.github.io 에 올립니다.
#   - 목록 페이지: 저장소 루트의 index.html, hub.css
#   - 드론 홈페이지: drone/ 폴더를 빌드한 결과를 /drone/ 아래에 올림
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4
      - name: Node.js 준비
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 드론 홈페이지 빌드
        working-directory: drone
        run: |
          npm ci
          npm run build
      - name: 배포 폴더 만들기
        run: |
          rm -rf _site
          mkdir -p _site/drone
          cp index.html hub.css _site/
          cp -r drone/dist/. _site/drone/
      - name: 배포 파일 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: GitHub Pages에 배포
        id: deployment
        uses: actions/deploy-pages@v4
